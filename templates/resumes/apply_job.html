{% extends 'base.html' %}
{% block content %}

<div class="bg-white p-4 rounded shadow max-w-3xl mx-auto">
    <h2 class="text-xl mb-3">Apply: {{ job.title }}</h2>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="mb-4">
            <label class="font-semibold">Resume text:</label>
            {{ form.resume_text }}
        </div>

        <div class="mb-4">
            <label class="font-semibold">Resume file:</label>
            {{ form.resume_file }}
        </div>

        <p class="text-sm text-gray-600">
            You can paste resume text or upload a PDF/DOCX (uploaded file text is extracted).
        </p>

        <button class="mt-3 px-4 py-2 bg-green-600 text-white rounded">
            Submit Application
        </button>
    </form>
</div>

{% endblock %}
